# ==============================================================
# GitHub Actions CI — Cost-Optimized Multi-Model Deployment System
# Repository: Heer45/cost-optimized-multi-model-deployment
# ==============================================================
#
# Pipeline stages:
#   1. Checkout            — clone the repository
#   2. Set up Python 3.13  — install the exact interpreter version
#   3. Install Dependencies — pip install -r requirements.txt
#   4. Run Tests           — routing logic + import smoke test
#   5. Build Docker Image  — prove the Dockerfile builds cleanly
#
# The Docker image is NOT pushed to any registry.
# This workflow is additive; the existing Jenkinsfile is unchanged.
# ==============================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Step 1: Checkout
      # Fetch the full repository contents into the runner.
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Step 2: Set up Python 3.13
      # Installs the exact Python version used in production and
      # in the Dockerfile so test behaviour matches the container.
      # ----------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ----------------------------------------------------------
      # Step 3: Install Dependencies
      # Install pinned versions from requirements.txt.
      # Matches the pip install step inside the Dockerfile.
      # ----------------------------------------------------------
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # ----------------------------------------------------------
      # Step 4a: Import smoke test
      # Verify that all core application modules import without
      # errors — catches missing files or broken imports early.
      # ----------------------------------------------------------
      - name: Application import smoke test
        run: python -c "import router, model_manager, cost_simulator; print('Application imports OK')"

      # ----------------------------------------------------------
      # Step 4b: Run routing tests
      # Execute the same test used by the Jenkins pipeline.
      # Tests SmartRouter, ModelManager, and all three ML models
      # end-to-end using real Breast Cancer dataset samples.
      # ----------------------------------------------------------
      - name: Run routing tests
        run: python test_routing.py

      # ----------------------------------------------------------
      # Step 5: Build Docker image
      # Build the image tagged with the commit SHA for
      # traceability. The image is NOT pushed to any registry.
      # This step proves the Dockerfile is always build-ready.
      # ----------------------------------------------------------
      - name: Build Docker image
        run: docker build -t cost-optimized-ml-app:${{ github.sha }} .

      # ----------------------------------------------------------
      # Step 6: Run Docker container
      # Start a detached container from the exact image just built.
      # Container name is unique per run (uses the commit SHA).
      # Host port 8502 is used instead of 8501 to avoid conflicts
      # with any live application already listening on 8501.
      # ----------------------------------------------------------
      - name: Run Docker container
        run: |
          docker run -d \
            --name ml-app-test-${{ github.sha }} \
            -p 8502:8501 \
            cost-optimized-ml-app:${{ github.sha }}

      # ----------------------------------------------------------
      # Step 7: Health check
      # Poll the Streamlit health endpoint every 5 seconds for up
      # to 60 seconds (12 attempts).  A 200 response means the
      # app is fully up inside the container.
      # If the timeout is reached, container logs are printed so
      # the failure is diagnosable, and the step exits non-zero
      # to fail the pipeline.
      # ----------------------------------------------------------
      - name: Wait for Streamlit health check
        run: |
          echo "Polling Streamlit health endpoint (timeout: 60 s)..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8502/_stcore/health || true)
            echo "  Attempt ${i}/12 — HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt ${i}."
              exit 0
            fi
            sleep 5
          done
          echo "Health check timed out after 60 s. Container logs:"
          docker logs ml-app-test-${{ github.sha }}
          exit 1

      # ----------------------------------------------------------
      # Step 8: Cleanup
      # Always remove the test container — even if the health
      # check step above failed — so the runner stays clean.
      # ----------------------------------------------------------
      - name: Remove test container
        if: always()
        run: |
          docker stop ml-app-test-${{ github.sha }} || true
          docker rm   ml-app-test-${{ github.sha }} || true
